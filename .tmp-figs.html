<style>:root{--ink:#2b2622;--ink-soft:#5b534b;--ink-faint:#8d857c;--line:#d8d0c4;--cinnabar-pure:#c8442e;--azure:#3c6e8f;--font-serif:'Songti SC',serif;background:#f6f1e7}body{background:#f6f1e7;font-family:var(--font-serif);max-width:720px;margin:0 auto;padding:20px}figure{margin:28px 0}figcaption{font-size:13px;color:var(--ink-soft);margin-top:8px}</style>
<figure><svg viewBox='0 0 640 300' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='26' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>同一句夸奖,两种给法</text><line x1='320' y1='42' x2='320' y2='286' style='stroke:var(--line);stroke-width:1;stroke-dasharray:4 4'/><text x='160' y='62' text-anchor='middle' style='font-family:var(--font-serif);font-size:13px;font-weight:bold;fill:var(--ink-soft)'>印象式评语</text><rect x='36' y='76' width='248' height='40' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='160' y='101' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>「妙。有唐人风致。」</text><line x1='160' y1='116' x2='160' y2='140' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='36' y='140' width='248' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='160' y='164' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-faint)'>你说不妙 —— 谈话到此为止</text><rect x='36' y='190' width='248' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='160' y='214' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-faint)'>想照着写 —— 无从下手</text><text x='160' y='262' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>结论给了,理由留在心里</text><text x='480' y='62' text-anchor='middle' style='font-family:var(--font-serif);font-size:13px;font-weight:bold;fill:var(--cinnabar-pure)'>可讨论的标准</text><rect x='356' y='76' width='248' height='40' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.3'/><text x='480' y='101' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>「有境界 —— 所写者真」</text><line x1='480' y1='116' x2='480' y2='140' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='356' y='140' width='248' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='480' y='164' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>可以争:我看这句不真,因为…</text><rect x='356' y='190' width='248' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='480' y='214' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>可以教:落笔先问,这是我见过的吗</text><text x='480' y='262' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--cinnabar-pure)'>结论后面挂着理由,于是能接着谈</text></svg><figcaption>差别不在夸得响不响,在结论后面挂没挂着理由 —— 挂着,才谈得下去,也才教得了人。</figcaption></figure>
<figure><svg viewBox='0 0 640 306' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='150' y='26' text-anchor='middle' style='font-family:var(--font-serif);font-size:13px;font-weight:bold;fill:var(--ink-soft)'>此前:几家店,几杆秤</text><rect x='24' y='48' width='118' height='40' rx='5' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='83' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>格调</text><text x='83' y='83' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>明清论诗</text><rect x='158' y='48' width='118' height='40' rx='5' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='217' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>气象</text><text x='217' y='83' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>严羽</text><rect x='24' y='104' width='118' height='40' rx='5' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='83' y='124' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>兴趣</text><text x='83' y='139' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>严羽《沧浪诗话》</text><rect x='158' y='104' width='118' height='40' rx='5' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='217' y='124' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>神韵</text><text x='217' y='139' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>王士禛</text><text x='150' y='176' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>各有道理,彼此不统属</text><text x='150' y='194' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>谁也解释不了谁</text><line x1='300' y1='106' x2='352' y2='106' style='stroke:var(--cinnabar-pure);stroke-width:1.2'/><path d='M352 106 l-9 -4 l0 8 z' style='fill:var(--cinnabar-pure)'/><text x='326' y='92' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--cinnabar-pure)'>面目 → 本</text><text x='492' y='26' text-anchor='middle' style='font-family:var(--font-serif);font-size:13px;font-weight:bold;fill:var(--cinnabar-pure)'>此后:一个总开关</text><rect x='412' y='48' width='160' height='42' rx='5' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.4'/><text x='492' y='75' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;fill:var(--cinnabar-pure)'>境界</text><line x1='492' y1='90' x2='492' y2='112' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='398' y1='112' x2='586' y2='112' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='398' y1='112' x2='398' y2='130' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='492' y1='112' x2='492' y2='130' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='586' y1='112' x2='586' y2='130' style='stroke:var(--ink-faint);stroke-width:1'/><text x='398' y='146' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink)'>自成高格</text><text x='492' y='146' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink)'>自有名句</text><text x='586' y='146' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink)'>气象神韵</text><text x='492' y='176' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>不是并列的优点,是「有境界」的下游</text><text x='320' y='236' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink-soft)'>兼并的打法:不说对手错,只说对手说的是长相</text><text x='320' y='258' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink-soft)'>—— 被降格的一方,连反驳的落点都没有</text></svg><figcaption>兼并前后:同一批评语,从「各说各的」被收进了一个有因果的结构 —— 它们由并列的优点,变成了下游的结果。</figcaption></figure>
<figure><svg viewBox='0 0 640 268' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='24' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>只有一道闸门</text><rect x='128' y='44' width='150' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='203' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>写景物</text><rect x='362' y='44' width='150' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='437' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>写喜怒哀乐</text><path d='M203 82 L290 112' style='stroke:var(--ink-faint);stroke-width:1'/><path d='M437 82 L350 112' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='260' y='112' width='120' height='44' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.4'/><text x='320' y='142' text-anchor='middle' style='font-family:var(--font-serif);font-size:18px;fill:var(--cinnabar-pure)'>真</text><text x='320' y='172' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>这一句,从你自己那儿过了一道吗</text><path d='M290 156 L200 196' style='stroke:var(--cinnabar-pure);stroke-width:1.2'/><path d='M350 156 L440 196' style='stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:4 4'/><rect x='104' y='196' width='190' height='42' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.3'/><text x='199' y='214' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>有境界</text><text x='199' y='231' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>景与情都可以</text><rect x='346' y='196' width='190' height='42' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='441' y='214' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink-soft)'>无境界</text><text x='441' y='231' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>字面可以很漂亮</text></svg><figcaption>写景、写情都可以进场,唯一的闸门是「真」。过不去的那些,字面上常常反而更漂亮。</figcaption></figure>
<figure><svg viewBox='0 0 640 250' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='24' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>大小是尺寸,优劣是成色</text><line x1='120' y1='96' x2='520' y2='96' style='stroke:var(--ink-soft);stroke-width:1.4'/><line x1='320' y1='96' x2='320' y2='150' style='stroke:var(--ink-soft);stroke-width:1.4'/><path d='M300 178 L320 150 L340 178 Z' style='fill:none;stroke:var(--ink-soft);stroke-width:1.2'/><line x1='120' y1='96' x2='120' y2='118' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='520' y1='96' x2='520' y2='118' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='84' y='118' width='72' height='26' rx='3' style='fill:none;stroke:var(--line);stroke-width:1'/><rect x='466' y='112' width='108' height='38' rx='3' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='120' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink)'>细雨鱼儿出,微风燕子斜</text><text x='120' y='56' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>小:一场雨,一只燕</text><text x='520' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink)'>落日照大旗,马鸣风萧萧</text><text x='520' y='56' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>大:一支行军的队伍</text><text x='120' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>「宝帘闲挂小银钩」</text><text x='520' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>「雾失楼台,月迷津渡」</text><text x='320' y='210' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>天平不因场面大小而倾斜</text><text x='320' y='232' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>决定成色的,还是那个「真」字</text></svg><figcaption>两组都是王国维自己举的例子。天平不因场面大小而倾斜 —— 决定成色的是另一件事。</figcaption></figure>
<figure><svg viewBox='0 0 640 268' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='24' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>旧瓶装新酒</text><rect x='30' y='46' width='230' height='72' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='145' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>带回来的:问题意识</text><text x='145' y='92' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>叔本华 · 康德一路</text><text x='145' y='109' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>美的判断能不能讲理</text><line x1='268' y1='82' x2='360' y2='82' style='stroke:var(--cinnabar-pure);stroke-width:1.2'/><path d='M360 82 l-9 -4 l0 8 z' style='fill:var(--cinnabar-pure)'/><text x='314' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>换一个说法</text><rect x='366' y='46' width='248' height='72' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.4'/><text x='490' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>用出来的:境界</text><text x='490' y='92' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>佛典译语里的旧词</text><text x='490' y='109' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>唐宋论诗久已言「境」</text><line x1='431' y1='118' x2='431' y2='142' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='555' y1='118' x2='555' y2='142' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='372' y='142' width='118' height='58' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='431' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>好处:像本土的东西</text><text x='431' y='185' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>不像译文,接得住</text><rect x='496' y='142' width='118' height='58' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='555' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>代价:自带层次感</text><text x='555' y='185' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>被读回「格局修养」</text><text x='320' y='238' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>他用旧词接住了读者,也被旧词的引力拖了回去</text></svg><figcaption>问题意识是外来的,词是本土的。这一手换来了极广的流传,也换来了一百年的误读。</figcaption></figure>
