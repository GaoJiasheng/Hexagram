<style>:root{--ink:#2b2622;--ink-soft:#5b534b;--ink-faint:#8d857c;--line:#d8d0c4;--cinnabar-pure:#c8442e;--font-serif:'Songti SC',serif}body{background:#f6f1e7;font-family:var(--font-serif);max-width:640px;margin:0 auto;padding:4px}figcaption{font-size:11px;color:var(--ink-soft);margin:2px 0 10px}</style>
<figure style='margin:0'><svg viewBox='0 0 640 264' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='24' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>只有一道闸门</text><rect x='128' y='44' width='150' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='203' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>写景物</text><rect x='362' y='44' width='150' height='38' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='437' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>写喜怒哀乐</text><path d='M203 82 L292 112' style='stroke:var(--ink-faint);stroke-width:1'/><path d='M437 82 L348 112' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='260' y='112' width='120' height='46' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.4'/><text x='320' y='144' text-anchor='middle' style='font-family:var(--font-serif);font-size:18px;fill:var(--cinnabar-pure)'>真</text><text x='320' y='182' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>从你自己那儿过了一道吗</text><path d='M286 158 L206 206' style='stroke:var(--cinnabar-pure);stroke-width:1.2'/><path d='M354 158 L434 206' style='stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:4 4'/><rect x='110' y='206' width='190' height='44' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.3'/><text x='205' y='226' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>有境界</text><text x='205' y='243' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>景与情都可以</text><rect x='340' y='206' width='190' height='44' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='435' y='226' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink-soft)'>无境界</text><text x='435' y='243' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>字面可以很漂亮</text></svg><figcaption>写景、写情都可以进场,唯一的闸门是「真」。过不去的那些,字面上常常反而更漂亮。</figcaption></figure>
<figure style='margin:0'><svg viewBox='0 0 640 262' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='26' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>大小是尺寸,优劣是成色</text><text x='110' y='62' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink-soft)'>小:一场雨,一只燕</text><text x='530' y='62' text-anchor='middle' style='font-family:var(--font-serif);font-size:12px;fill:var(--ink-soft)'>大:一支行军的队伍</text><line x1='110' y1='86' x2='530' y2='86' style='stroke:var(--ink-soft);stroke-width:1.4'/><line x1='320' y1='86' x2='320' y2='150' style='stroke:var(--ink-soft);stroke-width:1.4'/><path d='M298 178 L320 150 L342 178 Z' style='fill:none;stroke:var(--ink-soft);stroke-width:1.2'/><line x1='262' y1='178' x2='378' y2='178' style='stroke:var(--ink-soft);stroke-width:1.2'/><line x1='110' y1='86' x2='110' y2='108' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='530' y1='86' x2='530' y2='108' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='36' y='108' width='148' height='58' rx='4' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='110' y='132' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>细雨鱼儿出,微风燕子斜</text><text x='110' y='153' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>宝帘闲挂小银钩</text><rect x='456' y='108' width='148' height='58' rx='4' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='530' y='132' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>落日照大旗,马鸣风萧萧</text><text x='530' y='153' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>雾失楼台,月迷津渡</text><text x='320' y='218' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>天平不因场面大小而倾斜</text><text x='320' y='242' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>决定成色的,还是那个「真」字</text></svg><figcaption>两组都是王国维自己举的例子。天平不因场面大小而倾斜 —— 决定成色的是另一件事。</figcaption></figure>
<figure style='margin:0'><svg viewBox='0 0 640 268' xmlns='http://www.w3.org/2000/svg' style='width:100%;height:auto'><text x='320' y='24' text-anchor='middle' style='font-family:var(--font-serif);font-size:15px;font-weight:bold;fill:var(--ink)'>旧瓶装新酒</text><rect x='30' y='46' width='230' height='72' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='145' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--ink)'>带回来的:问题意识</text><text x='145' y='92' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>叔本华 · 康德一路</text><text x='145' y='109' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>美的判断能不能讲理</text><line x1='268' y1='82' x2='360' y2='82' style='stroke:var(--cinnabar-pure);stroke-width:1.2'/><path d='M360 82 l-9 -4 l0 8 z' style='fill:var(--cinnabar-pure)'/><text x='314' y='68' text-anchor='middle' style='font-family:var(--font-serif);font-size:10.5px;fill:var(--ink-faint)'>换一个说法</text><rect x='366' y='46' width='248' height='72' rx='6' style='fill:none;stroke:var(--cinnabar-pure);stroke-width:1.4'/><text x='490' y='72' text-anchor='middle' style='font-family:var(--font-serif);font-size:12.5px;fill:var(--cinnabar-pure)'>用出来的:境界</text><text x='490' y='92' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>佛典译语里的旧词</text><text x='490' y='109' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink-faint)'>唐宋论诗久已言「境」</text><line x1='431' y1='118' x2='431' y2='142' style='stroke:var(--ink-faint);stroke-width:1'/><line x1='555' y1='118' x2='555' y2='142' style='stroke:var(--ink-faint);stroke-width:1'/><rect x='372' y='142' width='118' height='58' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='431' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>好处:像本土的东西</text><text x='431' y='185' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>不像译文,接得住</text><rect x='496' y='142' width='118' height='58' rx='6' style='fill:none;stroke:var(--line);stroke-width:1'/><text x='555' y='166' text-anchor='middle' style='font-family:var(--font-serif);font-size:11px;fill:var(--ink)'>代价:自带层次感</text><text x='555' y='185' text-anchor='middle' style='font-family:var(--font-serif);font-size:10px;fill:var(--ink-faint)'>被读回「格局修养」</text><text x='320' y='238' text-anchor='middle' style='font-family:var(--font-serif);font-size:11.5px;fill:var(--ink-soft)'>他用旧词接住了读者,也被旧词的引力拖了回去</text></svg><figcaption>问题意识是外来的,词是本土的。这一手换来了极广的流传,也换来了一百年的误读。</figcaption></figure>
