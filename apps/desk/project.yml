# 观象 · 书桌 —— Xcode 工程由 xcodegen 从本文件生成:cd apps/desk && xcodegen
# 本目录不引用仓库里 ios/、src/ 的任何代码;内容走 public/desk/v1 的内容包(scripts/build-desk-packs.mjs)。
name: Desk
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Desk:
    type: application
    platform: iOS
    sources:
      - Desk
    info:
      path: Desk/Info.plist
      properties:
        CFBundleDisplayName: 观象 · 书桌
        # 版本号走构建设置(MARKETING_VERSION / CURRENT_PROJECT_VERSION),ship.sh 每次上传把构建号加一
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [NotoSerifSC-Regular.ttf, NotoSerifSC-Bold.ttf]
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations: [zh-Hans]
        # Google 登录回跳:guanxiangdesk://auth?code=…(服务端 NATIVE_REDIRECT_URL)
        CFBundleURLTypes:
          - CFBundleURLName: pub.gavin.hexa.desk.auth
            CFBundleURLSchemes: [guanxiangdesk]
        # 书包(.deskbook,docs/deskbook-standard.md):隔空投送、文件、分享菜单里出「用书桌打开」。
        # 不就地打开:系统把文件交到本 App 的 Inbox,导入时拷进书桌自己的目录,原文件不动
        CFBundleDocumentTypes:
          - CFBundleTypeName: 书包
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [pub.gavin.hexa.deskbook]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: pub.gavin.hexa.deskbook
            UTTypeDescription: 书桌书包
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [deskbook]
              public.mime-type: [application/vnd.deskbook+zip]
        LSSupportsOpeningDocumentsInPlace: false
    # 随 App 带的典籍核心包(清单里 bundled: true 的那几本,即首发六部;第一次打开没网也能读)。每次构建从 public/desk/v1 现拷,不进仓库的 apps/desk。
    # 清单整份带上(书目页没网也看得到全部典籍),其余各书的核心包、白话、插画、字体仍按需下载。拷不到(仓库外单独构建)就跳过,App 照旧联网取。
    preBuildScripts:
      - name: 拷入随 App 带的典籍内容包
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/../../public/desk/v1"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/BundledPacks"
          rm -rf "$DST"; mkdir -p "$DST"
          if [ ! -f "$SRC/manifest.json" ]; then echo "warning: 找不到 $SRC/manifest.json,不带内置内容包"; exit 0; fi
          cp "$SRC/manifest.json" "$DST/"
          # 清单里 bundled: true 的书的核心包文件名(用系统自带的 JavaScript 读 JSON,不依赖 node / python)
          FILES=$(/usr/bin/osascript -l JavaScript -e 'function run(a){ObjC.import("Foundation");var s=$.NSString.stringWithContentsOfFileEncodingError(a[0],$.NSUTF8StringEncoding,null).js;return JSON.parse(s).books.filter(function(b){return b.bundled}).map(function(b){return b.file}).join("\n")}' "$SRC/manifest.json")
          if [ -z "$FILES" ]; then echo "warning: 清单里没有 bundled 的书,不带内置内容包"; fi
          for f in $FILES; do
            cp "$SRC/$f" "$DST/" || { echo "warning: 缺 $f"; }
          done
          echo "{\"at\": $(date +%s)}" > "$DST/bundled.json"
          echo "内置内容包:$(ls "$DST" | wc -l | tr -d ' ') 个文件,$(du -sh "$DST" | cut -f1)"
    entitlements:
      path: Desk/Desk.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pub.gavin.hexa.desk
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
