# 观象 · 书桌 —— Xcode 工程由 xcodegen 从本文件生成:cd apps/desk && xcodegen
# 本目录不引用仓库里 ios/、src/ 的任何代码;内容走 public/desk/v1 的内容包(scripts/build-desk-packs.mjs)。
name: Desk
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Desk:
    type: application
    platform: iOS
    sources:
      - Desk
    info:
      path: Desk/Info.plist
      properties:
        CFBundleDisplayName: 观象 · 书桌
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [NotoSerifSC-Regular.ttf, NotoSerifSC-Bold.ttf]
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations: [zh-Hans]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pub.gavin.hexa.desk
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
