<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 搜索引擎所有权验证(2026-08-13):Google Search Console + Bing Webmaster。
         两者都明说「验证通过后也不要删」—— 删掉资源即失效,别当无用 meta 清理。 -->
    <meta name="google-site-verification" content="Mxei_bYYnLEdJUseip1PMFQRN1dH0d71TxkjNlMxsS4" />
    <meta name="msvalidate.01" content="B66E35528F2DAFE0F74979C4309B80A5" />
    <link rel="icon" type="image/svg+xml" href="/hexagram.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA「加到主屏幕」全屏运行(iOS + 安卓):独立 standalone、隐藏浏览器壳 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="观象" />
    <!-- 浏览器壳/状态栏配色,跟随明暗 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf6ec" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191713" />
    <link rel="alternate" type="application/rss+xml" title="观象 · 新收" href="/feed.xml" />
    <title>观象 · 古籍研读站</title>
    <!-- 数字一律由构建期从 public/content/stats.json 注入(vite.config statsMeta 插件),这里只放占位符;check-data 有闸 -->
    <meta name="description" content="__STATS_DESC__" />
    <!-- 分享卡 meta(#147,站点级静态兜底);逐页 og 由 functions/_middleware.js 对爬虫 UA 在边缘注入 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="观象" />
    <meta property="og:title" content="观象 · 古籍研读站" />
    <meta property="og:description" content="__STATS_DESC_SHORT__" />
    <meta property="og:image" content="/pwa-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="观象 · 古籍研读站" />
    <meta name="twitter:description" content="__STATS_DESC_SHORT__" />
    <meta name="twitter:image" content="/pwa-512.png" />
    <!-- 正文衬线字体自托管(v11 §1),@fontsource 在 main.jsx 引入 -->
  </head>
  <body>
    <div id="root"></div>
    <!-- 入口模块自愈(2026-10-01):装了 PWA 的老访客在发版后回来,旧 service worker 会用预缓存的旧 index.html 起页,
         它引用的入口 chunk 已不在服务器上(404 → SPA 回退成 HTML → "MIME type text/html")→ 入口模块根本没执行,
         main.jsx 里的 preloadError / pwaUpdate 自愈都没机会跑,页面永远空白。这段是经典脚本,模块加载失败也照跑:
         捕获入口 script 的 error → 催 SW 更新 → 新 worker 接管(controllerchange)即重载,4 秒兜底也重载;sessionStorage 防环。 -->
    <script>
      (function () {
        var KEY = 'guanxiang.v1.entry-reloaded'
        var done = false
        function reload() {
          if (done) return
          done = true
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, '1') } catch (e) {}
          location.reload()
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target
          if (!t || t.tagName !== 'SCRIPT' || t.type !== 'module' || !t.src) return
          var sw = navigator.serviceWorker
          if (sw) {
            sw.addEventListener('controllerchange', reload)
            sw.getRegistration().then(function (r) { return r && r.update() }).catch(function () {})
            setTimeout(reload, 4000)
          } else setTimeout(reload, 800)
        }, true)
        window.addEventListener('load', function () {
          setTimeout(function () { try { sessionStorage.removeItem(KEY) } catch (e) {} }, 8000)
        })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
