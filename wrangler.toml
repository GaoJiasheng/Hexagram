name = "hexa-gavin-pub"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"

# 发信:Pages 配置不支持 send_email 绑定(2026-10-06 部署校验拒),改由独立小 Worker hexa-mailer(workers/mailer/)持有
# Email Service 绑定,这里用服务绑定调它;server/mailer.js 先走它,失败退 Resend。
# ⚠️ 顶层键必须写在任何 [[表]] 之前,写在后面会被 TOML 并进上一张表(2026-10-06 踩过)

[[services]]
binding = "MAILER"
service = "hexa-mailer"

[[d1_databases]]
binding = "DB"
database_name = "hexagram-db"
database_id = "86b4edc6-b944-4ce1-9dbe-a1fb2a706782"
